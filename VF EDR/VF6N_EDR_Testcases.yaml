test_cases:
  - name: "04Engine throttle, percent full(WCBS_VehicleSpeed：0 KM/H ---> 50 KM/H)"
    description: "验证当车辆指示车速从 0 加速至 50 KM/H 时，VF6N_EDR 记录的车速数据是否准确为 50.0"
    node_overrides:
      "20D": "62 00 1B C0 00 00 00 00"
    expected_edr:
      signal_name: "04Speed_vehicle indicated"
      target_value: 50.0
      tolerance: 0.1

  - name: "05Engine throttle, percent full(WCBS_VehicleSpeed：0 KM/H ---> 10 KM/H)"
    description: "验证当车辆指示车速从 0 加速至 10 KM/H 时，VF6N_EDR 记录的车速数据是否准确为 10.0"
    node_overrides:
      "20D": "1D 00 05 88 00 00 00 00"
    expected_edr:
      signal_name: "04Speed_vehicle indicated"
      target_value: 10.0
      tolerance: 0.1

  - name: "05Engine throttle, percent full(CVC_ACPD_Percent:0 ---> 60 )"
    description: "验证当加速踏板开度(CVC_ACPD_Percent)设置为 60% 时，VF6N_EDR 记录的油门开度数据是否准确为 60.0"
    node_overrides:
      "D9": "39 00 3C 00 00 00 00 00"
    expected_edr:
      signal_name: "05Engine throttle_percent full (accelerator pedal percent full)"
      target_value: 60.0
      tolerance: 0.1

  - name: "05Engine throttle, percent full(CVC_ACPD_Percent:0 ---> 255 )"
    description: "验证当加速踏板开度信号达到上限值 255 时，VF6N_EDR 记录的油门开度数据是否正确处理为 255"
    node_overrides:
      "D9": "90 00 FF F0 00 00 00 00"
    expected_edr:
      signal_name: "05Engine throttle_percent full (accelerator pedal percent full)"
      target_value: 255
      tolerance: 0.1

  - name: "06Service brake, on/off(0x0: BLS not pressed )"
    description: "验证当制动灯开关(BLS)未按下(状态0x0)时，VF6N_EDR 记录的行车制动状态是否为 0 (Off)"
    node_overrides:
      "112": "0A 00 00 00 00 00 00 00"
    expected_edr:
      signal_name: "06Service brake_on/off"
      target_value: 0
      tolerance: 0.1

  - name: "06Service brake, on/off(0x1: BLS pressed)"
    description: "验证当制动灯开关(BLS)被按下(状态0x1)时，VF6N_EDR 记录的行车制动状态是否为 1 (On)"
    node_overrides:
      "112": "F3 40 00 00 02 00 00 00"
    expected_edr:
      signal_name: "06Service brake_on/off"
      target_value: 1
      tolerance: 0.1

  - name: "06Service brake, on/off(0x2: reserved)"
    description: "验证当制动灯开关信号为保留值(0x2)时，VF6N_EDR 记录的行车制动状态是否正确置为 255 (无效/不可用)"
    node_overrides:
      "112": "8C 80 00 00 02 00 00 00"
    expected_edr:
      signal_name: "06Service brake_on/off"
      target_value: 255
      tolerance: 0.1

  - name: "06Service brake, on/off(0x3: signal invalid)"
    description: "验证当制动灯开关信号无效(0x3)时，VF6N_EDR 记录的行车制动状态是否正确置为 255 (无效/不可用)"
    node_overrides:
      "112": "52 C0 00 00 02 00 00 00"
    expected_edr:
      signal_name: "06Service brake_on/off"
      target_value: 255
      tolerance: 0.1


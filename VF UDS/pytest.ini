[pytest]
# =========================================================================
# 1. 命令行默认运行参数配置 (addopts)
# =========================================================================
# -v              : 详细输出测试结果
# -s              : 允许 print 和 log 输出到控制台 (不捕获标准输出)
# --alluredir     : 自动生成 Allure 原始结果保存目录
# --clean-alluredir: 每次运行前自动清空旧的 allure-results 目录，防止旧数据污染
# --disable-warnings: 屏蔽无关的第三方库 Warning 警告信息
addopts = -v -s --alluredir=./allure-results --clean-alluredir --disable-warnings
#命令行终端中运行 Pytest 时，必须加入 -s 和 --log-cli-level=INFO 参数，这样控制台才不会拦截打印，会像标准 CAN 监听软件一样实时刷出全部报文
pytest Test_Generic.py -s -v --log-cli-level=INFO --alluredir=./allure-results

# =========================================================================
# 2. 测试文件与用例检索规则 (Discovery Rules)
# =========================================================================
# 搜索测试用例的根目录
testpaths = .

# 识别的测试文件名模式
python_files = Test_*.py test_*.py

# 识别的测试类名模式
python_classes = Test*

# 识别的测试函数/方法名模式
python_functions = test_*

# =========================================================================
# 3. 控制台实时日志配置 (Live Logging)
# 开启后可以在执行测试时直接在终端看到 [TX]/[RX] 诊断报文日志
# =========================================================================
# 开启控制台实时日志输出
log_cli = false

# 实时日志级别 (DEBUG, INFO, WARNING, ERROR)
log_cli_level = INFO

# 日志输出格式 (与 Conftest/UDS_client 保持一致)
log_cli_format = %(asctime)s [%(levelname)s] (%(filename)s:%(lineno)d): %(message)s

# 时间格式
log_cli_date_format = %Y-%m-%d %H:%M:%S

# =========================================================================
# 4. 自定义标记注册 (Custom Markers)
# 防止使用 pytest -m 时出现 PytestUnknownMarkWarning 警告
# =========================================================================
markers =
    uds: UDS 诊断测试用例
    smoke: 冒烟测试用例
    regression: 回归测试用例
    positive: 正响应测试用例
    negative: 否定响应/异常测试用例

# =========================================================================
# 5. 警告过滤规则 (Warning Filters)
# =========================================================================
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning